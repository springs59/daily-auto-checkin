name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build universal debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-universal-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build signed universal release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK size limit
        run: |
          max_bytes=$((10 * 1024 * 1024))
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            size=$(stat --format=%s "$apk")
            test "$size" -le "$max_bytes"
          done

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-universal-release-apk
          path: app/build/outputs/apk/release/*.apk
